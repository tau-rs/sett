name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      # the story tests (vitest browser mode, a11y gate) and the static smoke test run in Chromium
      - run: pnpm --filter @tau-rs/sett-storybook exec playwright install --with-deps chromium
      - run: pnpm build
      # llms.txt and skills/sett/SKILL.md are committed and regenerated by `pnpm build`, so the
      # staleness tests in packages/agent compare a file the build has just rewritten and can never
      # fail here. The diff against the checkout is the only check that sees the committed copy.
      # packages/ui/custom-elements.json is covered too: scripts/sort-manifest.mjs sorts its modules
      # by path at the end of the ui build, so it is the same bytes on every machine.
      - name: generated files are current (else run pnpm build and commit)
        run: git diff --exit-code -- llms.txt skills/ packages/ui/custom-elements.json
      - run: pnpm test
      - run: cargo test --workspace
      # the static Storybook, published as the run's artifact on every branch and to Pages from main
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/storybook/storybook-static
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: packages/storybook/storybook-static

  publish-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
